name: Arca
description: 'Arca (Arca Financial, Inc.) is an AI-native wealth management company founded by former
  Plaid product leader Rron Rexha and headquartered in New York. It pairs human financial advisors with a
  fully integrated, agentic platform in which AI agents are the primary operational users: monitoring emails,
  calls, documents, market data, and news, coordinating with one another, generating dynamic user interfaces,
  and executing multi-step advisory workflows so advisors can focus on client relationships. Arca is an
  SEC-registered investment adviser managing over $1 billion in client assets, and raised $64M across a seed
  round (led by Venrock) and a Series A (led by General Catalyst, with Index Ventures and Venrock). It has no
  public developer API surface at this time; this profile captures its public identity and security posture.'
